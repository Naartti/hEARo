# Push a tag `v<version>` (matching Cargo.toml) → build the app, package a DMG and publish a
# GitHub Release with a SHA-256 file and a build-provenance attestation (ADR 0016).
# Builds are ad-hoc signed and not notarized: no personal certificate ends up in a public
# binary. A tag must point at a commit on `main` whose CI run passed. Versions with a
# pre-release suffix (`v0.2.0-rc.1`) become GitHub pre-releases, so `releases/latest` stays
# stable. Run it manually (workflow_dispatch) for a read-only dry run that uploads an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # look up the CI run of the tagged commit
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # CFBundleVersion = commit count; ancestry check against main
          persist-credentials: false
      - name: Check the tag (version, on main, CI green)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF_TYPE" == tag ]] || exit 0
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1
          fi
          green="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)"
          if [[ "$green" == 0 ]]; then
            echo "::error::no successful CI run for $GITHUB_SHA yet; re-run this job once CI on main is green"; exit 1
          fi
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.11.2
          install: true
          cache: true
      - name: Build, sign ad-hoc and package
        env:
          ALLOW_ADHOC: '1'
          SIGN_IDENTITY: '-'
          HEARO_APP_DEST: ${{ github.workspace }}/dist/release/hEARo.app
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mise x -- scripts/build-app.sh release
          mise x -- scripts/package-dmg.sh "$HEARO_APP_DEST" "dist/release/hEARo-$VERSION.dmg"
          rm -rf "$HEARO_APP_DEST"
          cd dist/release
          shasum -a 256 "hEARo-$VERSION.dmg" > "hEARo-$VERSION.dmg.sha256"
          cat "hEARo-$VERSION.dmg.sha256"
      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hEARo-${{ steps.version.outputs.version }}${{ github.ref_type != 'tag' && '-dry-run' || '' }}
          path: dist/release/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hEARo-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hEARo-${{ needs.build.outputs.version }}.dmg
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 -c "hEARo-$VERSION.dmg.sha256"
          cat > notes.md <<'EOF'
          **Install:** download `hEARo-<version>.dmg`, open it and drag hEARo to Applications.
          The app isn't notarized, so the first launch needs System Settings → Privacy & Security →
          **Open Anyway**. Step by step: [docs/user/INSTALL.md](https://github.com/Naartti/hEARo/blob/main/docs/user/INSTALL.md).
          Apple silicon, macOS 26 or later.

          **Verify (optional):** `shasum -a 256 -c hEARo-<version>.dmg.sha256`, or
          `gh attestation verify hEARo-<version>.dmg --repo Naartti/hEARo`.
          EOF
          sed -i "s/<version>/$VERSION/g" notes.md
          pre=(); [[ "$VERSION" == *-* ]] && pre=(--prerelease --latest=false)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "hEARo $VERSION" --notes-file notes.md --generate-notes "${pre[@]}" \
            "hEARo-$VERSION.dmg" "hEARo-$VERSION.dmg.sha256"
