# Push a tag `v<version>` (matching Cargo.toml) → build the app, package a DMG and publish a
# GitHub Release with a SHA-256 file and a build-provenance attestation (ADR 0016).
# Builds are ad-hoc signed and not notarized: no personal certificate ends up in a public
# binary. Run it manually (workflow_dispatch) for a dry run that only uploads an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and publish
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # CFBundleVersion = commit count
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.11.2
          install: true
          cache: true
      - name: Check the tag matches the workspace version
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Build, sign ad-hoc and package
        env:
          ALLOW_ADHOC: '1'
          SIGN_IDENTITY: '-'
          HEARO_APP_DEST: ${{ github.workspace }}/dist/release/hEARo.app
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mise x -- scripts/build-app.sh release
          mise x -- scripts/package-dmg.sh "$HEARO_APP_DEST" "dist/release/hEARo-$VERSION.dmg"
          cd dist/release
          shasum -a 256 "hEARo-$VERSION.dmg" > "hEARo-$VERSION.dmg.sha256"
          cat "hEARo-$VERSION.dmg.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/release/hEARo-${{ steps.version.outputs.version }}.dmg
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          **Install:** download `hEARo-<version>.dmg`, open it and drag hEARo to Applications.
          The app isn't notarized, so the first launch needs System Settings → Privacy & Security →
          **Open Anyway**. Step by step: [docs/user/INSTALL.md](https://github.com/Naartti/hEARo/blob/main/docs/user/INSTALL.md).
          Apple silicon, macOS 26 or later.

          **Verify (optional):** `shasum -a 256 -c hEARo-<version>.dmg.sha256`, or
          `gh attestation verify hEARo-<version>.dmg --repo Naartti/hEARo`.
          EOF
          sed -i '' "s/<version>/$VERSION/g" notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "hEARo $VERSION" \
            --notes-file notes.md --generate-notes \
            "dist/release/hEARo-$VERSION.dmg" "dist/release/hEARo-$VERSION.dmg.sha256"
      - name: Upload the build (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hEARo-${{ steps.version.outputs.version }}-dry-run
          path: dist/release/
