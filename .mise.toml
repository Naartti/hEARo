# Pinned toolchains. `mise install` gives a ready environment.
[tools]
# Components here, not only in rust-toolchain.toml: mise sets RUSTUP_TOOLCHAIN, which makes
# rustup ignore that file's component list (a cached install on CI came back without them).
rust = { version = "1.100.0", components = "rustfmt,clippy", profile = "minimal" }
just = "1.59.0"
python = "3.12.16"
uv = "0.13.8"
node = "22.23.5"
lefthook = "2.2.2"
"cargo:cargo-nextest" = "0.9.151"
cargo-deny = "0.20.2"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-llvm-cov" = "0.9.1"
xcodegen = "2.46.0"
lychee = "0.24.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"npm:markdownlint-cli2" = "0.24.1"

[settings]
experimental = true
