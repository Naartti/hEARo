# XcodeGen spec — OPTIONAL IDE path (`just xcode`). The primary build is SwiftPM via
# `just app` (scripts/build-app.sh), which needs only Command Line Tools. See ADR 0004.
# The generated .xcodeproj is git-ignored; never edit it by hand.
name: hEARo
options:
  bundleIdPrefix: io.github.naartti
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  HearoKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_ENTITLEMENTS: Resources/hEARo.entitlements
    INFOPLIST_FILE: Resources/Info.plist
    GENERATE_INFOPLIST_FILE: NO
targets:
  hEARo:
    type: application
    platform: macOS
    sources:
      - path: hEARo
    dependencies:
      - package: HearoKit
        product: HearoKit
    # One identity for Debug and Release (docs/dev/SIGNING.md). The app icon (.icns) is
    # rendered by `just icon` and bundled only by scripts/build-app.sh, not by this target.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.naartti.hearo
        PRODUCT_NAME: hEARo
schemes:
  hEARo:
    build:
      targets:
        hEARo: all
    test:
      config: Debug
