[project]
name = "hearo-ml"
version = "0.3.0"
description = "hEARo ML pipeline: data, mixing, training, evaluation, ONNX export (M7)."
requires-python = ">=3.12,<3.13"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "numpy==2.5.5",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "torch==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hearo_ml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (training, large data); excluded from `just check`"]
